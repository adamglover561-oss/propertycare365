name: Assign latest iOS build to TestFlight group

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Target Apple TestFlight build number
        required: true
        type: string
      declare_exempt_encryption:
        description: Confirm the app and its libraries use only exempt encryption
        required: true
        type: boolean
        default: false
      submit_for_beta_review:
        description: Submit this exact build for external Apple TestFlight review
        required: true
        type: boolean
        default: false
      wait_for_processing:
        description: Wait up to 40 minutes for the exact uploaded build to finish Apple processing
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Assign latest processed build to external TestFlight testers
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EXPECTED_BUILD_NUMBER: ${{ inputs.build_number }}
          DECLARE_EXEMPT_ENCRYPTION: ${{ inputs.declare_exempt_encryption }}
          SUBMIT_FOR_BETA_REVIEW: ${{ inputs.submit_for_beta_review }}
          WAIT_FOR_PROCESSING: ${{ inputs.wait_for_processing }}
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'uri'

          %w[ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY].each { |name| abort "Missing Apple secret #{name}" if ENV[name].to_s.empty? }
          key = OpenSSL::PKey.read(ENV.fetch('ASC_PRIVATE_KEY'))
          encode = ->(x) { Base64.urlsafe_encode64(JSON.generate(x), padding: false) }
          now = Time.now.to_i
          unsigned = [encode.call({alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT'}), encode.call({iss: ENV.fetch('ASC_ISSUER_ID'), iat: now, exp: now + 900, aud: 'appstoreconnect-v1'})].join('.')
          der = key.sign(OpenSSL::Digest::SHA256.new, unsigned)
          signature = OpenSSL::ASN1.decode(der).value.map { |i| [i.value.to_i.to_s(16).rjust(64, '0')].pack('H*') }.join
          token = [unsigned, Base64.urlsafe_encode64(signature, padding: false)].join('.')

          def apple(method, path, query, payload, token)
            uri = URI('https://api.appstoreconnect.apple.com' + path)
            uri.query = URI.encode_www_form(query) unless query.empty?
            request = case method
            when 'POST' then Net::HTTP::Post.new(uri)
            when 'PATCH' then Net::HTTP::Patch.new(uri)
            else Net::HTTP::Get.new(uri)
            end
            request['Authorization'] = 'Bearer ' + token
            request['Accept'] = 'application/json'
            if payload
              request['Content-Type'] = 'application/json'
              request.body = JSON.generate(payload)
            end
            response = Net::HTTP.start(uri.host, uri.port, use_ssl: true, open_timeout: 15, read_timeout: 25) { |http| http.request(request) }
            unless response.code.to_i.between?(200, 299)
              issues = begin
                JSON.parse(response.body).fetch('errors', []).map { |e| [e['title'],e['detail']].compact.join(': ') }.join('; ')
              rescue StandardError
                'No details'
              end
              raise "Apple API #{path}: HTTP #{response.code}: #{issues}"
            end
            response.body.to_s.empty? ? {} : JSON.parse(response.body)
          end

          bundle = 'uk.co.propertycare360.app'
          app = apple('GET', '/v1/apps', {'filter[bundleId]' => bundle, 'limit' => '10'}, nil, token).fetch('data').find { |x| x.dig('attributes','bundleId') == bundle }
          abort 'Apple app record not found' unless app
          app_id = app.fetch('id')
          groups = apple('GET', "/v1/apps/#{app_id}/betaGroups", {'limit' => '30'}, nil, token).fetch('data')
          group = groups.find { |g| g.dig('attributes','name') == 'External Field Test' && g.dig('attributes','isInternalGroup') == false }
          abort 'External testing group missing' unless group
          group_id = group.fetch('id')

          expected = ENV.fetch('EXPECTED_BUILD_NUMBER').strip
          abort 'A numeric build number is required' unless expected.match?(/\A[0-9]+\z/)
          wait_enabled = ENV.fetch('WAIT_FOR_PROCESSING', 'false') == 'true'
          deadline = Time.now + (wait_enabled ? 40 * 60 : 0)
          latest = nil
          version = expected
          loop do
            builds = apple('GET', '/v1/builds', {'filter[app]' => app_id,'sort' => '-uploadedDate','limit' => '50'}, nil, token).fetch('data')
            target = builds.find { |b| b.dig('attributes','version').to_s == expected }
            if target && builds.first.fetch('id') != target.fetch('id')
              abort "Build #{expected} is no longer the latest upload; refusing to assign an older build"
            end
            status = target&.dig('attributes','processingState') || 'not listed yet'
            puts "Expected build #{expected}: processing=#{status}"
            if target && status == 'VALID'
              latest = target
              break
            end
            abort "Apple reports build #{expected} processing failure: #{status}" if ['FAILED','INVALID'].include?(status)
            abort "Build #{expected} is not ready in Apple; please rerun after processing" unless wait_enabled && Time.now < deadline
            sleep 45
          end
          puts "Verified build #{version} is latest and VALID"
          detail = apple('GET', "/v1/builds/#{latest.fetch('id')}/buildBetaDetail", {}, nil, token)
          external_state = detail.dig('data', 'attributes', 'externalBuildState')
          puts "External state before assignment: #{external_state || 'unknown'}"
          if external_state == 'MISSING_EXPORT_COMPLIANCE'
            abort 'App encryption classification was not confirmed' unless ENV.fetch('DECLARE_EXEMPT_ENCRYPTION', 'false') == 'true'
            apple('PATCH', "/v1/builds/#{latest.fetch('id')}", {}, {data: {type: 'builds', id: latest.fetch('id'), attributes: {usesNonExemptEncryption: false}}}, token)
            detail = apple('GET', "/v1/builds/#{latest.fetch('id')}/buildBetaDetail", {}, nil, token)
            puts "External state after exempt-encryption declaration: #{detail.dig('data', 'attributes', 'externalBuildState') || 'unknown'}"
          end

          assigned = apple('GET', "/v1/betaGroups/#{group_id}/relationships/builds", {'limit' => '100'}, nil, token).fetch('data')
          if assigned.any? { |x| x.fetch('id') == latest.fetch('id') }
            puts "Build #{version} already assigned to External Field Test"
          else
            apple('POST', "/v1/betaGroups/#{group_id}/relationships/builds", {}, {data: [{type: 'builds', id: latest.fetch('id')}]}, token)
            puts "Assigned build #{version} to External Field Test"
          end
          detail = apple('GET', "/v1/builds/#{latest.fetch('id')}/buildBetaDetail", {}, nil, token)
          external_state = detail.dig('data', 'attributes', 'externalBuildState')
          puts "External TestFlight state: #{external_state || 'unknown'}"
          if ENV.fetch('SUBMIT_FOR_BETA_REVIEW', 'false') == 'true'
            if external_state == 'READY_FOR_BETA_SUBMISSION'
              submission = apple('POST', '/v1/betaAppReviewSubmissions', {}, {data: {type: 'betaAppReviewSubmissions', relationships: {build: {data: {type: 'builds', id: latest.fetch('id')}}}}}, token)
              puts "Submitted build #{version} for Apple TestFlight beta review. Submission #{submission.dig('data', 'id') || 'created'}"
              puts "Apple beta review state: #{submission.dig('data', 'attributes', 'betaReviewState') || 'pending'}"
            elsif ['WAITING_FOR_BETA_REVIEW', 'IN_BETA_REVIEW', 'IN_BETA_TESTING', 'READY_FOR_BETA_TESTING'].include?(external_state)
              puts "Build #{version} already progressed to #{external_state}; no duplicate review request"
            else
              abort "Build #{version} is not ready for beta review: #{external_state || 'unknown'}"
            end
          end
          RUBY
