name: Property Care 360 membership contract checks

on:
  push:
    branches: [main, feature/pc360-initial-12-month-term-20261012]
    paths:
      - public/**
      - supabase/migrations/**
      - tests/membership-contract.test.cjs
      - tests/webhook.test.cjs
      - tests/owner-push.test.cjs
      - tests/membership-welcome-integration.test.cjs
      - tests/membership-welcome-flow.test.cjs
      - supabase/functions/stripe-webhook/index.ts
      - supabase/functions/owner-push/index.ts
      - .github/workflows/membership-contract-ci.yml
  pull_request:
    paths:
      - public/**
      - supabase/migrations/**
      - tests/membership-contract.test.cjs
      - tests/webhook.test.cjs
      - tests/owner-push.test.cjs
      - tests/membership-welcome-flow.test.cjs
      - supabase/functions/stripe-webhook/index.ts
      - supabase/functions/owner-push/index.ts

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test terms, consent, rates and checkout safeguards
        run: node --test tests/membership-contract.test.cjs tests/webhook.test.cjs tests/membership-welcome-integration.test.cjs tests/membership-welcome-flow.test.cjs tests/owner-push.test.cjs
