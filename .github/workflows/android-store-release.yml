name: Android store release

on:
  workflow_dispatch:

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build web bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Apply branded native assets
        run: node scripts/native-assets.mjs
      - name: Sync Android
        run: npx cap sync android
      - name: Build release bundle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease
      - name: Sign release bundle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          rm -f upload-keystore.jks
      - name: Upload signed Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: property-care-360-android-signed-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
